<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin login — TableTap</title>
<meta name="description" content="TableTap Super Admin login.">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="auth-page">
  <header class="auth-page__header">
    <div class="auth-page__header-inner">
      <div class="brand" aria-label="TableTap">
        <span class="brand__mark"><i data-lucide="shield"></i></span>
        <span class="brand__name">TableTap Admin</span>
      </div>
    </div>
  </header>

  <main class="auth-page__main">
    <div class="auth-card">
      <h1 class="auth-card__title">Admin login</h1>
      <p class="auth-card__sub">Platform administration portal.</p>

      <form class="auth-card__form" id="admin-login-form" action="#" method="post">
        <div class="field">
          <label class="label" for="email">Email address</label>
          <input class="input" type="email" id="email" name="email" autocomplete="email" placeholder="you@company.com" required>
        </div>

        <div class="field">
          <label class="label" for="password">Password</label>
          <div class="input-group">
            <input class="input" type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="input-group__action" type="button" data-password-toggle aria-controls="password" aria-pressed="false" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <p class="hint hint--error" id="login-error" role="alert" hidden></p>

        <div class="field">
          <button class="btn btn--primary btn--lg btn--block" type="submit" id="admin-login-btn">Log in</button>
        </div>
      </form>

    </div>
  </main>

  <footer class="auth-page__footer">
    © 2026 TableTap · Internal Access
  </footer>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>if(window.lucide)lucide.createIcons();</script>
<script src="../assets/js/ui.js"></script>
<script type="module" src="../assets/js/auth-pages.js"></script>
<script type="module" src="../assets/js/motion-fx.js"></script>
</body>
</html>
