<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — TableTap</title>
<meta name="description" content="TableTap owner panel for Spice Route.">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/style.css">
<script type="module" src="../assets/js/layout.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
</head>
<body data-page="dashboard" data-title="Dashboard">
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell">

  <div id="app-sidebar"></div>

  <div class="app-shell__scrim" data-panel-close></div>

  <div class="app-shell__main">
    <div id="app-topbar"></div>
    <script data-shell-boot>(function () {var root = document.documentElement;root.classList.add('tt-pending');try {var body = document.body;var sidebar = document.getElementById('app-sidebar');var topbar = document.getElementById('app-topbar');if (!body || !sidebar) return;var page = body.getAttribute('data-page') || '';var KEYS = ['tqr_admin_session', 'tqr_session', 'tqr_floor_session', 'tqr_kitchen_session'];var stamp = KEYS.map(function (k) { return localStorage.getItem(k) || ''; }).join('|');var raw = localStorage.getItem('tt_shell:' + (body.getAttribute('data-role') || 'app') + ':' + (page === 'floor' ? 'floor' : 'std'));if (!raw) return;var cached = JSON.parse(raw);if (!cached || cached.stamp !== stamp) return;sidebar.innerHTML = cached.sidebar || '';if (topbar) topbar.innerHTML = cached.topbar || '';var ALIAS = { 'menu-item.html': 'menu.html', 'client-detail.html': 'clients.html' };var file = location.pathname.split('/').pop() || '';var want = ALIAS[file] || file;var links = sidebar.querySelectorAll('a.nav-link');for (var i = 0; i < links.length; i++) {var href = (links[i].getAttribute('href') || '').split('?')[0].split('/').pop();if (href === want) { links[i].classList.add('active'); links[i].setAttribute('aria-current', 'page'); }}var title = topbar && topbar.querySelector('.app-shell__title');if (title) title.textContent = body.getAttribute('data-title') || document.title.split('—')[0].split('·')[0].trim();} catch (e) {  }})();</script>

    <main class="app-shell__content" id="main">
      <div class="app-shell__content-inner">
      <div class="page-head">
        <div>
          <h1 class="page-head__title">Loading Dashboard…</h1>
          <p class="page-head__sub">Fetching live restaurant data and real-time statistics…</p>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat"><p class="stat__label">Today's orders</p><p class="stat__value">—</p></div>
        <div class="stat"><p class="stat__label">Today's revenue</p><p class="stat__value">—</p></div>
        <div class="stat"><p class="stat__label">Avg order value</p><p class="stat__value">—</p></div>
        <div class="stat"><p class="stat__label">Active tables</p><p class="stat__value">—</p></div>
      </div>
    </div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>if(window.lucide)lucide.createIcons();</script>
<script src="../assets/js/i18n.js?v=20261112a"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/file-check.js"></script>
<script type="module" src="../assets/js/owner.js"></script>
<script type="module" src="../assets/js/motion-fx.js"></script>
</body>
</html>
