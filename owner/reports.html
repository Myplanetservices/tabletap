<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports — TableTap</title>
<meta name="description" content="TableTap owner panel for Spice Route.">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/style.css">
<script type="module" src="../assets/js/layout.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
</head>
<body data-page="reports" data-title="Reports">
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell">

  <div id="app-sidebar"></div>

  <div class="app-shell__scrim" data-panel-close></div>

  <div class="app-shell__main">
    <div id="app-topbar"></div>

    <main class="app-shell__content" id="main">
      <div class="app-shell__content-inner">
      <div class="page-head">
        <div>
          <h1 class="page-head__title">Reports</h1>
          <p class="page-head__sub">Loading restaurant performance metrics and revenue analytics…</p>
        </div>
      <div class="page-head__actions"><button class="btn btn--secondary btn--sm" type="button" disabled><i data-lucide="loader-2"></i> Loading…</button></div>
      </div>
      <div class="stat-grid mt-4">
        <div class="stat"><p class="stat__label">Revenue</p><p class="stat__value">—</p></div>
        <div class="stat"><p class="stat__label">Orders</p><p class="stat__value">—</p></div>
        <div class="stat"><p class="stat__label">Avg order value</p><p class="stat__value">—</p></div>
        <div class="stat"><p class="stat__label">Items sold</p><p class="stat__value">—</p></div>
      </div>
      </div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>if(window.lucide)lucide.createIcons();</script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/file-check.js"></script>
<script type="module" src="../assets/js/owner.js"></script>
</body>
</html>
