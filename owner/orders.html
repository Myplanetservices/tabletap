<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Orders — TableTap</title>
<meta name="description" content="TableTap owner panel for Spice Route.">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/style.css">
<script type="module" src="../assets/js/layout.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
</head>
<body data-page="orders" data-title="Live Orders">
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell">

  <div id="app-sidebar"></div>

  <div class="app-shell__scrim" data-panel-close></div>

  <div class="app-shell__main">
    <div id="app-topbar"></div>

    <main class="app-shell__content" id="main">
      <div class="app-shell__content-inner">
      <div class="page-head">
        <div>
          <h1 class="page-head__title">Live orders</h1>
          <p class="page-head__sub">Fetching live restaurant orders and waiter calls…</p>
        </div>
        <div class="page-head__actions">
          <button class="btn btn--secondary btn--sm" type="button" disabled><i data-lucide="loader-2"></i> Loading…</button>
        </div>
      </div>
      <div class="card">
        <div class="card__body">
          <p class="muted text-sm" style="text-align:center;padding:2rem;">Connecting to order queue and live dining room…</p>
        </div>
      </div>
      <div id="drawer-host"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>if(window.lucide)lucide.createIcons();</script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/file-check.js"></script>
<script type="module" src="../assets/js/owner.js"></script>
</body>
</html>
